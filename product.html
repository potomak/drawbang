<!doctype html>
<html lang="en">
  <head>
    <!--CHROME:ANALYTICS-->
    <!--CHROME:META-PIXEL-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Draw! · Product</title>
    <meta name="drawbang:active" content="products" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!--CHROME:HEADER-->
    <main data-product-page data-drawing-id="" data-product-id="" data-frame="0">
      <a id="backToDrawing" class="pp-back" href="/gallery">← Back to gallery</a>

      <div class="pp-grid">
        <div class="pp-media">
          <div class="pp-mockup-wrap" id="pp-mockup-wrap">
            <img id="pp-mockup-img" src="/mockups/tee.jpg" alt="product mockup" width="600" height="600" />
            <canvas id="pp-mockup-canvas" aria-label="product mockup" width="600" height="600" hidden></canvas>
          </div>
          <div class="pp-preview-wrap" hidden>
            <img
              id="pp-drawing"
              class="pp-drawing-img"
              alt="drawing preview"
              width="360"
              height="360"
            />
            <canvas id="pp-preview" hidden></canvas>
          </div>
          <div id="frameStrip" class="pp-frame-strip" hidden></div>
        </div>

        <div class="pp-details">
          <h1 id="pp-title" class="pp-title">Product</h1>
          <p id="pp-product-name" class="pp-subtitle"></p>

          <!-- Placement + Variant selector: hydrated by src/product.ts. SSR
               (lib/templates/product-page.ts) pre-renders the same structure
               server-side; this HTML is the SPA fallback. -->
          <section class="pp-step" id="pp-step-placement">
            <h2 class="pp-step-h"><span class="pp-step-num">02</span> Placement</h2>
            <div id="pp-placement-picker" class="mc-pills" data-testid="placement-picker">
              <button type="button" class="btn sm" data-placement="full-chest" aria-pressed="true">Full chest</button>
              <button type="button" class="btn sm" data-placement="left-chest" aria-pressed="false">Left chest</button>
              <button type="button" class="btn sm" data-placement="right-chest" aria-pressed="false">Right chest</button>
              <button type="button" class="btn sm" data-placement="pattern-2x2" aria-pressed="false">Pattern 2×2</button>
              <button type="button" class="btn sm" data-placement="pattern-3x3" aria-pressed="false">Pattern 3×3</button>
              <button type="button" class="btn sm" data-placement="pattern-4x4" aria-pressed="false">Pattern 4×4</button>
            </div>
          </section>

          <section class="pp-step" id="step-variant">
            <h2 class="pp-step-h"><span class="pp-step-num">01</span> Variant</h2>
            <select id="variantSelect" data-variant-select aria-label="Choose variant"></select>
            <div id="variantPicker" data-variant-picker class="pp-pills" hidden></div>
            <div id="sizePicker" data-size-picker class="pp-pills" hidden></div>
            <div id="colorPicker" data-color-picker class="pp-pills" hidden></div>
            <div id="pp-size-picker" class="mc-pills" data-testid="size-picker" hidden></div>
            <div id="pp-color-picker" class="mc-pills" data-testid="color-picker" hidden></div>
            <div id="pp-placement-picker" class="mc-pills" hidden></div>
          </section>

          <section class="pp-summary" id="pp-summary">
            <div class="pp-summary-row">
              <span>Subtotal</span><span id="sumSubtotal" data-subtotal>—</span>
            </div>
            <div class="pp-summary-row">
              <span>Shipping</span><span id="sumShipping" data-shipping>—</span>
            </div>
            <div class="pp-summary-row total">
              <span>Total</span><span id="sumTotal" data-total>—</span>
            </div>
            <div class="pp-price" id="price" data-price aria-live="polite"></div>
            <button id="pp-checkout" data-checkout class="btn primary full" type="button" disabled>
              Continue to checkout
            </button>
            <p class="pp-disclaim">Printed on demand · ships in 5–7 days</p>
            <p id="pp-status" data-status class="pp-status" role="status" aria-live="polite"></p>
          </section>
        </div>
      </div>

      <!-- SSR injects product JSON here; SPA fetch falls back to /merch/products -->
      <script id="product-data" type="application/json"></script>
    </main>
    <!--CHROME:FOOTER-->
    <script type="module" src="./src/product.ts"></script>
  </body>
</html>
